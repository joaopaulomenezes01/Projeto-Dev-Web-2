{% extends 'oficina/base.html' %}
{% block conteudo %}
<div class="d-flex justify-content-between align-items-center mb-3">
  <h2 class="mb-0">Veículos</h2>
  <a class="btn btn-primary" href="{% url 'veiculo_criar' %}">Novo veículo</a>
</div>
<table class="table table-striped align-middle">
  <thead><tr><th>Placa</th><th>Marca</th><th>Modelo</th><th>Ano</th><th>Cliente</th><th></th></tr></thead>
  <tbody>
  {% for v in object_list %}
    <tr>
      <td>{{ v.placa }}</td>
      <td>{{ v.marca }}</td>
      <td>{{ v.modelo }}</td>
      <td>{{ v.ano|default:"" }}</td>
      <td>{{ v.cliente }}</td>
      <td class="text-end">
        <a class="btn btn-sm btn-outline-secondary" href="{% url 'veiculo_editar' v.pk %}">Editar</a>
        <a class="btn btn-sm btn-outline-danger" href="{% url 'veiculo_excluir' v.pk %}">Excluir</a>
      </td>
    </tr>
  {% empty %}
    <tr><td colspan="6">Nenhum veículo cadastrado.</td></tr>
  {% endfor %}
  </tbody>
</table>
{% endblock %}
