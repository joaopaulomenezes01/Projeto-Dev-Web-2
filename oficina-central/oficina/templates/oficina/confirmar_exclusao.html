{% extends 'oficina/base.html' %}
{% block conteudo %}
<h2 class="mb-3">Excluir</h2>
<p>Tem certeza que quer excluir <strong>{{ object }}</strong>?</p>
<p class="text-muted small">Itens ligados a este registro (por exemplo, veículos de um cliente e as ordens deles) também serão excluídos.</p>
<form method="post">
  {% csrf_token %}
  <button class="btn btn-danger">Sim, excluir</button>
  <a class="btn btn-secondary" href="javascript:history.back()">Cancelar</a>
</form>
{% endblock %}
