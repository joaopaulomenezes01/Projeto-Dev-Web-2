{% extends 'oficina/base.html' %}
{% block conteudo %}
<div class="d-flex justify-content-between align-items-center mb-3">
  <h2 class="mb-0">Clientes</h2>
  <a class="btn btn-primary" href="{% url 'cliente_criar' %}">Novo cliente</a>
</div>
<table class="table table-striped align-middle">
  <thead><tr><th>Nome</th><th>Telefone</th><th>E-mail</th><th></th></tr></thead>
  <tbody>
  {% for c in object_list %}
    <tr>
      <td>{{ c.nome }}</td>
      <td>{{ c.telefone }}</td>
      <td>{{ c.email }}</td>
      <td class="text-end">
        <a class="btn btn-sm btn-outline-secondary" href="{% url 'cliente_editar' c.pk %}">Editar</a>
        <a class="btn btn-sm btn-outline-danger" href="{% url 'cliente_excluir' c.pk %}">Excluir</a>
      </td>
    </tr>
  {% empty %}
    <tr><td colspan="4">Nenhum cliente cadastrado.</td></tr>
  {% endfor %}
  </tbody>
</table>
{% endblock %}
