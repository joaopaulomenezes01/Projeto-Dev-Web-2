{% extends 'oficina/base.html' %}
{% block conteudo %}
<div class="d-flex justify-content-between align-items-center mb-3">
  <h2 class="mb-0">Mecânicos</h2>
  <a class="btn btn-primary" href="{% url 'mecanico_criar' %}">Novo mecânico</a>
</div>
<table class="table table-striped align-middle">
  <thead><tr><th>Nome</th><th>Telefone</th><th></th></tr></thead>
  <tbody>
  {% for m in object_list %}
    <tr>
      <td>{{ m.nome }}</td>
      <td>{{ m.telefone }}</td>
      <td class="text-end">
        <a class="btn btn-sm btn-outline-secondary" href="{% url 'mecanico_editar' m.pk %}">Editar</a>
        <a class="btn btn-sm btn-outline-danger" href="{% url 'mecanico_excluir' m.pk %}">Excluir</a>
      </td>
    </tr>
  {% empty %}
    <tr><td colspan="3">Nenhum mecânico cadastrado.</td></tr>
  {% endfor %}
  </tbody>
</table>
{% endblock %}
